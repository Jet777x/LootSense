name: Something's wrong
description: A wrong price, a crash, or something that doesn't work.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: item
    attributes:
      label: The item
      description: For a wrong price, hover the item in game, press Ctrl+C and paste it here.
      render: text
  - type: input
    id: version
    attributes:
      label: Loot Sense version
      description: Shown at the bottom of Settings.
      placeholder: "1.0.0"
